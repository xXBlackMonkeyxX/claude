name: Validate repository

on:
  push:
    branches: [main, 'fix/**', 'feature/**', 'refactor/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate manifests and scripts
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate repository
        shell: pwsh
        run: ./tools/validation/validate-repository.ps1
